name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-api:
    name: API Tests
    runs-on: ubuntu-latest

    env:
      API_BASE_URL: https://reqres.in
      API_KEY: ${{ secrets.API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run API tests
        run: npm run test:api

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: allure-results/
          retention-days: 7

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-api
          path: reports/html-report/
          retention-days: 7

  test-ui:
    name: UI Tests — ${{ matrix.project }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: ui-tests
            browser: chromium
          - project: ui-tests-firefox
            browser: firefox

    env:
      UI_BASE_URL: https://www.saucedemo.com
      SAUCE_STANDARD_USER: ${{ secrets.SAUCE_STANDARD_USER }}
      SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
      SAUCE_LOCKED_USER: ${{ secrets.SAUCE_LOCKED_USER }}
      SAUCE_PROBLEM_USER: ${{ secrets.SAUCE_PROBLEM_USER }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run UI tests — ${{ matrix.project }}
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload Allure results — ${{ matrix.project }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results/
          retention-days: 7

      - name: Upload HTML report — ${{ matrix.project }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-${{ matrix.project }}
          path: reports/html-report/
          retention-days: 7

  test-visual:
    name: Visual Regression Tests
    runs-on: ubuntu-latest

    env:
      UI_BASE_URL: https://www.saucedemo.com
      SAUCE_STANDARD_USER: ${{ secrets.SAUCE_STANDARD_USER }}
      SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
      SAUCE_LOCKED_USER: ${{ secrets.SAUCE_LOCKED_USER }}
      SAUCE_PROBLEM_USER: ${{ secrets.SAUCE_PROBLEM_USER }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run visual regression tests
        run: npm run test:visual

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-visual
          path: allure-results/
          retention-days: 7

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-visual
          path: reports/html-report/
          retention-days: 7

  test-a11y:
    name: Accessibility Tests
    runs-on: ubuntu-latest

    env:
      UI_BASE_URL: https://www.saucedemo.com
      SAUCE_STANDARD_USER: ${{ secrets.SAUCE_STANDARD_USER }}
      SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
      SAUCE_LOCKED_USER: ${{ secrets.SAUCE_LOCKED_USER }}
      SAUCE_PROBLEM_USER: ${{ secrets.SAUCE_PROBLEM_USER }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run accessibility tests
        run: npm run test:a11y

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-a11y
          path: allure-results/
          retention-days: 7

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-a11y
          path: reports/html-report/
          retention-days: 7

  publish-allure-report:
    name: Publish Allure Report
    runs-on: ubuntu-latest
    needs: [test-api, test-ui, test-visual, test-a11y]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results/
          merge-multiple: true

      - name: Generate Allure report
        run: npm run allure:generate

      - name: Upload combined Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-combined
          path: allure-report/
          retention-days: 30
