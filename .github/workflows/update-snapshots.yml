name: Update Visual Snapshots

on:
  workflow_dispatch:  # manual trigger only

jobs:
  update-snapshots:
    name: Generate Linux Baselines — visual-tests
    runs-on: ubuntu-latest

    env:
      UI_BASE_URL: https://www.saucedemo.com
      SAUCE_STANDARD_USER: ${{ secrets.SAUCE_STANDARD_USER }}
      SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
      SAUCE_LOCKED_USER: ${{ secrets.SAUCE_LOCKED_USER }}
      SAUCE_PROBLEM_USER: ${{ secrets.SAUCE_PROBLEM_USER }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate Linux baselines (visual-tests project only)
        run: npm run test:visual:update

      - name: Commit and push snapshots
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update visual regression baselines for linux"
          file_pattern: "src/ui/tests/visual/**/*.png"
